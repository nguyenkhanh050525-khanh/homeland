<section class="page-title">
    <h1>Đăng ký nhận tư vấn</h1>
</section>

<section class="form-box">

    <form id="registerForm">

        <label>Họ và tên</label>
        <input type="text" id="name" placeholder="Nhập họ tên">

        <label>Số điện thoại</label>
        <input type="tel" id="phone" placeholder="Nhập số điện thoại">

        <label>Email</label>
        <input type="email" id="email" placeholder="Nhập email">

        <label>Nhu cầu</label>

        <select id="need">
            <option>Mua căn hộ</option>
            <option>Mua nhà phố</option>
            <option>Mua biệt thự</option>
            <option>Tư vấn khác</option>
        </select>

        <button class="btn" type="submit">
            Đăng ký
        </button>

        <p id="message"></p>

    </form>

</section>
